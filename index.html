<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逸刻 · 记录与分享</title>
    <script>
      // 在 Vue 挂载前就把 .dark / .light 挂到 <html> 上，
      // 不然深色用户会先看到一帧白屏闪烁。
      // 读的是 @vueuse/core 的同一个 key，逻辑跟 src/composables/useTheme.ts 对齐。
      ;(() => {
        const saved = localStorage.getItem('vueuse-color-scheme')
        const followSystem = !saved || saved === 'auto'
        const dark =
          saved === 'dark' || (followSystem && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
